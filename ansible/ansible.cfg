[defaults]
# Disable host key checking so the first SSH connection doesn't hang waiting
# for a "yes/no" prompt in the CI/CD pipeline.
host_key_checking = False

# Default remote user (matches the admin_username Terraform variable)
remote_user = azureuser

# Private key set here as a fallback; the inventory overrides this per host.
private_key_file = ~/.ssh/id_rsa

# Keep SSH connections open between tasks to speed up playbook execution
[ssh_connection]
pipelining = True
