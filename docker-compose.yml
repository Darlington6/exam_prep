version: "3.8"

services:
  # Backend API service
  backend:
    build: ./backend
    container_name: exam_backend
    ports:
      - "5001:5001"   # Host:Container
    env_file:
      - ./backend/.env
    depends_on:
      - mongo        # Ensure Mongo starts first
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/auth/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend served via Nginx
  frontend:
    build: ./frontend
    container_name: exam_frontend
    ports:
      - "3000:80"    # Host:Container (Nginx runs on 80)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB database service
  mongo:
    image: mongo:6
    container_name: exam_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db   # Persistent database storage
    restart: unless-stopped

# Named volume for persistent MongoDB data
volumes:
  mongo-data:
