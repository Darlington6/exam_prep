name: CI Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Backend

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      # Frontend

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # Docker Image Builds

      - name: Build Backend Docker Image
        run: docker build -t exam_backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t exam_frontend ./frontend

      # Container Image Security Scanning (Trivy)
      
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: exam_backend
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: exam_frontend
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # IaC Security Scanning (tfsec)
      # Scans Terraform code for misconfigurations.
     
      - name: Run tfsec (Terraform IaC Security Scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: false # Explicitly fail the build if issues are found
          github_token: ${{ secrets.GITHUB_TOKEN }}
          