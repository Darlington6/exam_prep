# .github/workflows/terraform.yml
# Runs Terraform checks on PRs and applies changes on merges to main
name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate with Terraform Cloud using an API token stored in repo secrets
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format
        run: terraform fmt -check -recursive
        # working-directory: terraform

      - name: Terraform Init
        run: terraform init
        # working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        # working-directory: terraform

      # Runs a speculative plan — shows what would change without touching state.
      # The actual apply is handled by Terraform Cloud's VCS integration
      # automatically when this code merges to main. This avoids duplicate apply.
      - name: Terraform Plan
        run: terraform plan -input=false
        # working-directory: terraform
        