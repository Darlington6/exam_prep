server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy all /api/* requests to the backend container.
    # Inside the Docker network "backend" resolves to the backend service.
    # This means the browser never needs to know the backend port or IP —
    # everything flows through the same origin and CORS is a non-issue.
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # React Router support: redirect all 404s back to index.html so
    # client-side routing (e.g. /dashboard, /exams) works on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively for better performance. These files are fingerprinted with content hashes, so safely cache them for a long time.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
